[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-coding"
version = "0.1.0"
description = "Local coding-agent harness with tools, sessions, and on-demand skills."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pyreadline3>=3.5.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
coding = "python_claw_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
python_claw_agent = ["skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
